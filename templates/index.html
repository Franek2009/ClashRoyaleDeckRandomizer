<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clash Royale Deck Randomizer</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="container">

        <header class="header">
            <h1>Clash Royale Deck Randomizer</h1>
            <p>Randomize your deck and start playing!</p>

            <form action="/generate" method="post">
                <button type="submit" class="generate-button">
                    Generate Deck
                </button>
            </form>
        </header>


        {% if deck %}

            <section class="deck-section">

                <h2>Your Deck</h2>

                <div class="deck">

                    {% for card in deck %}

                        <article class="card">

                            <div class="card-image">
                                <img
                                    src="{{ card['iconUrls']['medium'] }}"
                                    alt="{{ card['name'] }}"
                                >
                            </div>

                            <div class="card-info">

                                <h3>{{ card['name'] }}</h3>

                                <div class="card-details">

                                    <span class="rarity">
                                        {{ card['rarity'] }}
                                    </span>

                                    <span class="elixir">
                                        <span class="elixir-icon"></span>
                                        {{ card['elixirCost'] }}
                                    </span>

                                </div>

                            </div>

                        </article>

                    {% endfor %}

                </div>

            </section>

        {% endif %}

    </main>

</body>

</html>
